name: "Build, Test & Push"

on:
  push:
    branches:
      - "**/**" # Required to avoid needlessly running the CI on tag push

jobs:
  build-development:
    name: Build - Development
    uses: infoxchange/github-ci/.github/workflows/build-docker-image.yaml@v2
    with:
      workflow-ref: v2
      image-target: development

  build-distribution:
    name: Build - Distribution
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/build-docker-image.yaml@v2
    with:
      workflow-ref: v2
      image-target: distribution

  lint-eslint:
    name: Lint - ESLint
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-eslint

  lint-tsc:
    name: Lint - TypeScript
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-tsc

  lint-stylelint:
    name: Lint - Stylelint
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-stylelint

  lint-jsonlint:
    name: Lint - JSON Lint
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-jsonlint

  lint-hadolint:
    name: Lint - Hadolint
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-hadolint
      additional-run-args: -v $(pwd)/Dockerfile:/app/Dockerfile

  lint-shellcheck:
    name: Lint - Shellcheck
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-shellcheck

  lint-storybook-components:
    name: Lint - Storybook components check
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: lint-storybook-components

  lint-broken-links:
    name: Lint - Broken links check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Check for broken links
        uses: ./.github/actions/broken-link-check
        with:
          msTeamsAlertsWebhook: ${{ secrets.MS_TEAMS_ALERTS_WEBHOOK }}

  test-e2e-personalisation:
    name: Test - personalisation
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker-with-possible-artifact.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: with --test-env --built --mocks test-e2e-personalisation
      docker-path-to-copy-from: /app/testing-screenshots
      host-path-to-copy-to: testing-screenshots

  test-e2e-category-queries:
    name: Test - category queries
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker-with-possible-artifact.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: with --test-env --built --mocks test-e2e-category-queries
      docker-path-to-copy-from: /app/testing-screenshots
      host-path-to-copy-to: testing-screenshots

  test-e2e-features-1:
    name: Test - features 1
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker-with-possible-artifact.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: with --test-env --built --mocks test-e2e-features-1
      docker-path-to-copy-from: /app/testing-screenshots
      host-path-to-copy-to: testing-screenshots

  test-e2e-features-2:
    name: Test - features 2
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker-with-possible-artifact.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: with --test-env --built --mocks test-e2e-features-2
      docker-path-to-copy-from: /app/testing-screenshots
      host-path-to-copy-to: testing-screenshots

  test-e2e-maps:
    name: Test - maps
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker-with-possible-artifact.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: with --test-env --built --mocks test-e2e-maps
      docker-path-to-copy-from: /app/testing-screenshots
      host-path-to-copy-to: testing-screenshots

  test-unit:
    name: Test - unit
    needs: build-development
    uses: infoxchange/github-ci/.github/workflows/run-in-docker.yaml@v2
    with:
      workflow-ref: v2
      image-target: development
      command: test-unit

  deploy:
    name: Deploy - Push image to ECR
    needs:
      - build-distribution
      - lint-eslint
      - lint-stylelint
      - lint-jsonlint
      - lint-hadolint
      - lint-shellcheck
      - lint-storybook-components
      - lint-broken-links
      - test-e2e-personalisation
      - test-e2e-category-queries
      - test-e2e-features-1
      - test-e2e-features-2
      - test-e2e-maps
      - test-unit
    uses: infoxchange/github-ci/.github/workflows/push-docker-image-to-ecr.yaml@v2
    with:
      workflow-ref: v2
      image-target: distribution
      ecr-image-name: ask_izzy
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    permissions:
      id-token: write
      contents: read
