"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the
`date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO
8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

"""
The `JSON` scalar type represents JSON values as specified by ECMA-404.
"""
scalar JSON

type Query {
  alerts(filters: AlertFiltersInput, sort: [String], pagination: PaginationArg): [Alert]!
  pages(filters: PageFiltersInput, sort: [String], pagination: PaginationArg): [Page]!
  callouts(filters: CalloutFiltersInput, sort: [String], pagination: PaginationArg): [Callout]!
}

input PaginationArg {
  page: Int
  pageSize: Int
  start: Int
  limit: Int
}

# ===== Enums =====

enum ENUM_ALERT_ALERTLEVEL {
  warn
  info
}

enum ENUM_ALERT_SCREENLOCATION {
  homePage
  resultsPage
  servicePage
}

# ===== Content Types =====

type Alert {
  documentId: ID!
  createdAt: DateTime
  updatedAt: DateTime
  title: String!
  body: String
  alertLevel: ENUM_ALERT_ALERTLEVEL
  defaultToOpen: Boolean
  screenLocation: ENUM_ALERT_SCREENLOCATION
  states: [State]!
}

type State {
  documentId: ID!
  Name: String
}

type Page {
  documentId: ID!
  updatedAt: DateTime
  Title: String
  Body: String
  Path: String
  BannerTextPrimary: String
  BannerTextSecondary: String
  AccordionTitle: String
  banner: Banner
  Accordion: [ComponentContentAccordion]
  CalloutBoxes: [ComponentContentCalloutBox]
}

type Banner {
  documentId: ID!
  Key: String!
}

type ComponentContentAccordion {
  id: ID!
  Title: String!
  Content: String
}

type ComponentContentCalloutBox {
  id: ID!
  Top: Boolean
  Bottom: Boolean
  callout: Callout
}

type Callout {
  documentId: ID!
  Key: String!
  Heading: String!
  ShowHeading: Boolean
  Body: String
  Style: JSON
  Phone: String
  Link: String
  className: StyleClasses
}

type StyleClasses {
  documentId: ID!
  className: String
}

# ===== Filter Input Types =====

input IDFilterInput {
  eq: ID
  ne: ID
  in: [ID]
  notIn: [ID]
  null: Boolean
  notNull: Boolean
}

input StringFilterInput {
  eq: String
  eqi: String
  ne: String
  in: [String]
  notIn: [String]
  contains: String
  containsi: String
  notContains: String
  notContainsi: String
  startsWith: String
  endsWith: String
  null: Boolean
  notNull: Boolean
}

input BooleanFilterInput {
  eq: Boolean
  ne: Boolean
  null: Boolean
  notNull: Boolean
}

input StateFiltersInput {
  documentId: IDFilterInput
  Name: StringFilterInput
  or: [StateFiltersInput]
  and: [StateFiltersInput]
  not: StateFiltersInput
}

input AlertFiltersInput {
  documentId: IDFilterInput
  title: StringFilterInput
  body: StringFilterInput
  alertLevel: StringFilterInput
  defaultToOpen: BooleanFilterInput
  screenLocation: StringFilterInput
  states: StateFiltersInput
  or: [AlertFiltersInput]
  and: [AlertFiltersInput]
  not: AlertFiltersInput
}

input PageFiltersInput {
  documentId: IDFilterInput
  Path: StringFilterInput
  Title: StringFilterInput
  or: [PageFiltersInput]
  and: [PageFiltersInput]
  not: PageFiltersInput
}

input CalloutFiltersInput {
  documentId: IDFilterInput
  Key: StringFilterInput
  or: [CalloutFiltersInput]
  and: [CalloutFiltersInput]
  not: CalloutFiltersInput
}
